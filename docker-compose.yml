# Postgres for Knowledge Review (local dev and EC2).
#   docker compose up -d        start
#   docker compose ps           check health
#   docker compose down         stop (data is kept in the kr_pgdata volume)
#   docker compose down -v      stop AND delete all data
services:
  postgres:
    image: postgres:16
    container_name: kr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kr_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_review}
    ports:
      # Bound to all interfaces so LAN machines can connect (firewall rule "kr-postgres" limits it to the LAN).
      # Never publish this to the internet. To go back to local-only, use "127.0.0.1:${POSTGRES_PORT:-5432}:5432".
      - "0.0.0.0:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kr_pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ------------------------------------------------------------------------------------------------------------
  # Full stack on the EC2 (PDF section 3). Started only with the "app" profile, so `npm run db:up` is unchanged:
  #   docker compose --profile app up -d --build
  # Neo4j and the KB MCP server already run separately; the web app reaches the MCP server via KG_MCP_URL.
  # The Claude harness runs inside the web container (non-root user, minimal environment; see docs/CHAT-HARNESS.md).
  web:
    profiles: ["app"]
    build: .
    container_name: kr-web
    restart: unless-stopped
    env_file: .env
    environment:
      COOKIE_SECURE: "true"
      CLAUDE_CONFIG_DIR: /home/app/.claude
      CLAUDE_HARNESS_DIR: /app/claude-harness
    volumes:
      - kr_claude:/home/app/.claude # Claude credentials + session transcripts (needed for resume)
    expose:
      - "3000" # reachable only through nginx, never published

  nginx:
    profiles: ["app"]
    image: nginx:1.27-alpine
    container_name: kr-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - web

volumes:
  kr_pgdata:
  kr_claude:
