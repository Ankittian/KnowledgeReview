# Postgres for Knowledge Review (local dev and EC2).
#   docker compose up -d        start
#   docker compose ps           check health
#   docker compose down         stop (data is kept in the kr_pgdata volume)
#   docker compose down -v      stop AND delete all data
services:
  postgres:
    image: postgres:16
    container_name: kr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kr_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_review}
    ports:
      # Bound to localhost only. Never publish 5432 to the internet.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kr_pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  kr_pgdata:
